# FPL rules for the 2025/26 season (ADR-0005).
schema_version: 1
ruleset_version: "2025-26.1"
season: "2025-26"
num_gameweeks: 38
provenance:
  sources:
    - {title: "All you need to know about changes to FPL for 2025/26 (premierleague.com)", url: "https://www.premierleague.com/news/4362211", accessed: 2026-10-02, note: "via search summary"}
    - {title: "FPL rule changes: Defensive contributions, double chips & extra free transfers (Flashscore)", url: "https://www.flashscore.com/news/soccer-premier-league-fpl-rule-changes-defensive-contributions-double-chips-extra-free-transfers/xdGbtADF", accessed: 2026-10-02, note: "via search summary"}
    - {title: "FPL GW16 free transfer top-up (Fantasy Football Scout)", url: "https://www.fantasyfootballscout.co.uk/2025/12/08/fpl-gameweek-16-free-transfer-top-up-all-you-need-to-know", accessed: 2026-10-02, note: "via search summary"}
  verification:
    squad: secondary-source
    lineup: secondary-source
    transfers: secondary-source
    chips: secondary-source
    scoring: secondary-source
    timing: assumed
  notes:
    - "Defensive contribution points introduced this season."
    - "Two sets of chips; first set must be played by the GW19 deadline."
    - "AFCON top-up: free transfers set to five for GW16."

squad:
  size: 15
  initial_budget: 1000
  positions: {GK: 2, DEF: 5, MID: 5, FWD: 3}
  max_per_club: 3
lineup:
  starters: 11
  min_per_position: {GK: 1, DEF: 3, MID: 2, FWD: 1}
  max_per_position: {GK: 1, DEF: 5, MID: 5, FWD: 3}
  bench_goalkeepers: 1
  bench_outfield: 3
pricing:
  selling_price_rule: half_profit_floor
  price_step: 1
  min_price: 35
  max_price: 200
captaincy:
  captain_multiplier: 2
  vice_promotes_if_captain_did_not_play: true

transfers:
  free_transfers_per_gameweek: 1
  max_banked_free_transfers: 5
  hit_cost: 4
  first_gameweek_unlimited: true
  initial_free_transfers_after_first_gameweek: 1
  chip_ft_policy: retain
  top_ups: [{gameweek: 16, set_free_transfers_to: 5, reason: "AFCON top-up"}]

chips:
  one_chip_per_gameweek: true
  triple_captain_multiplier: 3
  free_hit_reverts: true
  catalogue:
    - {id: wildcard_1, type: wildcard, first_gameweek: 2, last_gameweek: 19}
    - {id: free_hit_1, type: free_hit, first_gameweek: 2, last_gameweek: 19}
    - {id: bench_boost_1, type: bench_boost, first_gameweek: 1, last_gameweek: 19}
    - {id: triple_captain_1, type: triple_captain, first_gameweek: 1, last_gameweek: 19}
    - {id: wildcard_2, type: wildcard, first_gameweek: 20, last_gameweek: 38}
    - {id: free_hit_2, type: free_hit, first_gameweek: 20, last_gameweek: 38}
    - {id: bench_boost_2, type: bench_boost, first_gameweek: 20, last_gameweek: 38}
    - {id: triple_captain_2, type: triple_captain, first_gameweek: 20, last_gameweek: 38}

scoring:
  appearance:
    full_minutes_threshold: 60
    points_below_threshold: 1
    points_at_or_above_threshold: 2
  goal: {GK: 10, DEF: 6, MID: 5, FWD: 4}
  assist: 3
  clean_sheet:
    min_minutes: 60
    points: {GK: 4, DEF: 4, MID: 1, FWD: 0}
  goals_conceded:
    per_goals: 2
    points: {GK: -1, DEF: -1, MID: 0, FWD: 0}
  saves:
    per_saves: 3
    points: 1
  penalty_save: 5
  penalty_miss: -2
  yellow_card: -1
  red_card: -3
  own_goal: -2
  defensive_contribution:
    enabled: true
    by_position:
      DEF: {threshold: 10, points: 2, actions: [clearances_blocks_interceptions, tackles]}
      MID: {threshold: 12, points: 2, actions: [clearances_blocks_interceptions, tackles, recoveries]}
      FWD: {threshold: 12, points: 2, actions: [clearances_blocks_interceptions, tackles, recoveries]}
  bonus:
    awards: [3, 2, 1]
    tie_rule: fpl_standard

timing:
  decision_buffer_minutes: 90
  provisional_lag_minutes: 150
  finalization_lag_hours: 24

bps_notes:
  - "2025/26 BPS: one BPS per two clearances/blocks/interceptions; -1 BPS when tackled."
