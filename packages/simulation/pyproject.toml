[project]
name = "fpl-simulation"
version = "0.1.0"
description = "Joint fixture-level Monte Carlo simulation and sample scoring"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fpl-domain",
  "numpy>=2.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_simulation"]

[tool.uv.sources]
fpl-domain = { workspace = true }
