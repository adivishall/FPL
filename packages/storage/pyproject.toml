[project]
name = "fpl-storage"
version = "0.1.0"
description = "PostgreSQL schema, repositories, raw store and point-in-time dataset access"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fpl-domain",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "pandas>=3.0",
  "pyarrow>=25.0",
  "numpy>=2.5",
  "joblib>=1.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_storage"]

[tool.uv.sources]
fpl-domain = { workspace = true }
