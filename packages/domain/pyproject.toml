[project]
name = "fpl-domain"
version = "0.1.0"
description = "Domain entities, versioned FPL rulesets, scoring and state transitions"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "pydantic>=2.13",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_domain"]
