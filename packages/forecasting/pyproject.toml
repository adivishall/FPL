[project]
name = "fpl-forecasting"
version = "0.1.0"
description = "Team strength, minutes, event, bonus and price models; baselines; calibration; registry"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fpl-domain",
  "fpl-storage",
  "fpl-features",
  "numpy>=2.5",
  "pandas>=3.0",
  "scipy>=1.18",
  "scikit-learn>=1.9",
  "lightgbm>=4.7",
  "joblib>=1.6",
  "matplotlib>=3.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_forecasting"]

[tool.uv.sources]
fpl-domain = { workspace = true }
fpl-storage = { workspace = true }
fpl-features = { workspace = true }
