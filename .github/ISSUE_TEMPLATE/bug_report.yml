name: Bug report
description: Something in FPL Copilot behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, session cookies, passwords, `.env` contents, manager keys or real
        managers' data. Security problems go through private reporting (see SECURITY.md).
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps, page or API route, and request (with identifiers redacted).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Error messages, response status, screenshots (redacted).
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or branch
      placeholder: e.g. develop @ 1a2b3c4
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Docker Compose or local services; OS and CPU; browser; anything non-default in your configuration.
  - type: textarea
    id: data
    attributes:
      label: Data context
      description: The `freshness` block of the response (snapshot id, gameweek), if relevant.
