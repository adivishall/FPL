[project]
name = "fpl-notifications"
version = "0.1.0"
description = "Alert rules, materiality thresholds and delivery channels"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fpl-domain",
  "fpl-storage",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_notifications"]

[tool.uv.sources]
fpl-domain = { workspace = true }
fpl-storage = { workspace = true }
