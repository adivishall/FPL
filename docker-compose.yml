# Local production-like stack. Secrets come from .env (never committed); see .env.example.
# The /data volume holds canonical snapshots, raw captures, forecasts and the feature store;
# seed it once with `docker compose run --rm scheduler fpl-ingest historical --all` followed by
# `docker compose run --rm scheduler fpl-ingest export-snapshot` (see docs/DEPLOYMENT.md).
services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fpl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fpl}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fpl}"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:6379:6379"]

  migrate:
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    image: fpl-engine:${FPL_IMAGE_TAG:-local}   # one image for api, worker, scheduler, migrate
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}

  api:
    restart: unless-stopped
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    image: fpl-engine:${FPL_IMAGE_TAG:-local}   # one image for api, worker, scheduler, migrate
    env_file: .env
    environment:   # serve precomputed forecasts only; promote a snapshot once its forecast exists
      FPL_FORECAST_ON_DEMAND: "false"
      FPL_SERVE_READY_SNAPSHOTS_ONLY: "true"
      FPL_SOLVER_WORKERS: "1"   # synchronous requests never spawn solver processes
    ports: ["127.0.0.1:8000:8000"]
    volumes: [data:/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    restart: unless-stopped
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    image: fpl-engine:${FPL_IMAGE_TAG:-local}   # one image for api, worker, scheduler, migrate
    command: ["fpl-worker", "work"]
    env_file: .env
    environment:   # jobs run in forked work horses: aggregate their metrics (scrape :9101)
      PROMETHEUS_MULTIPROC_DIR: /tmp/fpl-metrics
      FPL_WORKER_METRICS_PORT: "9101"
      # processes per recommendation job for independent solves (set to the worker's vCPUs)
      FPL_SOLVER_WORKERS: ${FPL_SOLVER_WORKERS:-2}
    volumes: [data:/data]
    healthcheck:   # the image's default probe is the API's HTTP check; workers serve no HTTP
      test: ["CMD", "fpl-worker", "healthcheck", "work"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  scheduler:
    restart: unless-stopped
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    image: fpl-engine:${FPL_IMAGE_TAG:-local}   # one image for api, worker, scheduler, migrate
    command: ["fpl-worker", "schedule"]
    env_file: .env
    volumes: [data:/data]
    healthcheck:
      test: ["CMD", "fpl-worker", "healthcheck", "schedule"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15m   # the first tick runs every task (live refresh, forecast) before beating
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    restart: unless-stopped
    # same-origin proxy mode: the browser calls /backend/*, the Next server adds the API key
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    image: fpl-web:${FPL_IMAGE_TAG:-local}
    environment:
      FPL_API_INTERNAL_URL: http://api:8000
      FPL_API_KEY: ${FPL_WEB_API_KEY:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  prometheus:
    # optional: `docker compose --profile monitoring up -d` — scrapes api + worker, loads the
    # alert rules of docs/DEPLOYMENT.md (no Alertmanager is configured)
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes: ["./infra/deployment/prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker]

volumes:
  pgdata: {}
  data: {}
