# Local production-like stack. Secrets come from .env (never committed); see .env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fpl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fpl}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fpl}"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:6379:6379"]

  migrate:
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}

  api:
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: [artifacts:/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    command: ["fpl-worker", "work"]
    env_file: .env
    volumes: [artifacts:/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  scheduler:
    build: {context: ., dockerfile: infra/docker/python.Dockerfile}
    command: ["fpl-worker", "schedule"]
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata: {}
  artifacts: {}
